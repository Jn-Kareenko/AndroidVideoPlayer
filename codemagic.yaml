# Codemagic CI/CD for Android Project

# Application configuration
app:
  name: "VideoPlayer"

# Build configuration
build:
  android:
    buildCommand: assembleDebug

# Artifacts - what to publish
artifacts:
  - app/build/outputs/debug/app-debug.apk

# Workflows - required section
workflows:
  main:
    branches:
      only:
        - main
    jobs:
      - build:
          steps:
            - cache/restore
            - git-clone
            - make
            - archive
